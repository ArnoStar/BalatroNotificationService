<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>$heading</title>
  </head>
  <body style="margin:0;padding:0;background:#1e2b2d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1e2b2d;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#2b3a3d;border:3px solid #374244;border-radius:14px;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:#ffffff;">
            <tr>
              <td style="padding:28px 28px 8px;text-align:center;">
                <div style="font-size:26px;font-weight:900;letter-spacing:4px;color:#ffffff;text-shadow:2px 2px 0 #fe5f55,4px 4px 0 #0069ad;">$site_name_upper</div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 28px 0;">
                <h1 style="margin:0 0 12px;font-size:20px;">$heading</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#e6ecec;">$intro</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 28px;">
                <div style="display:inline-block;padding:14px 22px;background:#1e2b2d;border-radius:10px;box-shadow:0 4px 0 #0069ad;font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#eac058;">$code</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 28px;">
                <p style="margin:0 0 12px;font-size:14px;color:#b7c3c5;">The code works for $minutes_text.</p>
                <p style="margin:0;font-size:14px;color:#b7c3c5;">$outro</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#7f8e90;">
            <a href="$site_url" style="color:#7f8e90;">$site_name</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
